name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing - no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24' # OIDC trusted-publishing handshake has a known bug before Node 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest # OIDC trusted publishing needs npm CLI >=11.5.1

      - run: npm ci

      - run: npm publish --provenance --access public
